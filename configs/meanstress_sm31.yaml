# 平均应力敏感度工况：与 configs/fretting_base.yaml 只差一个 loading.sigma_m。
# 用途：CIGRE 试验在 EDS 张力下做，铝丝带拉伸平均应力（20% RTS -> 41.3 MPa，
# 15% RTS -> 31.0 MPa），而本模型此前是 R = -1 全反复（D-5 的简化）。
# 与基准工况（同 sigma_a = 35、sigma_m = 0、N_f = 80012）配对比较。
#
# **为什么取 EDS 15% 而不是 20%**：psi+ 由峰值总应力决定，门槛在峰值约
# 69-72 MPa 处被跨过（实测：66.3 -> 0.968x 零越界；69.0 -> 0.993x；72.0 -> 1.021x 有越界）。
# sigma_a=35 + 41.3 的峰值 76.3 MPa 已越门槛（1.062x），损伤会是静态的、
# 算出来不是疲劳寿命。取 31.0 使峰值 66.3 MPa，裕度 3.2%。
case_type: fretting
material: configs/material_al1350.yaml
model:
  split: spectral
  dissipation: AT1
  k_res: 1.0e-06
solver:
  u_solver: newton
  tol_d: 0.0001
  max_iter: 2000
  u_linesearch: basic
  relaxation: 0.25
contact:
  p0: 240000000.0
  mu: 0.7
  Q_over_muP: 0.6
  R_wire: 0.001875
  counterpart: aluminum
mesh:
  type: fretting
  W: 0.0064
  H: 0.0032
  refine_halfwidth_factor: 3.0
  refine_depth: 0.00013
  h_fine: 5.0e-07
  h_coarse: 0.0002
  transition_factor: 8.0
loading:
  type: fretting_contact
  sigma_a: 35000000.0
  cycle:
    n_sub: 8
    dN_init: 100.0
    dN_min: 1.0
    dN_max: 100000.0
    dd_max: 0.02
    grow_below: 0.5
    factor: 2.0
    N_max: 100000000.0
    peak_phase: null
  dump_every: 25
  sigma_m: 31000000.0
failure:
  d_threshold: 0.95
  depth: 0.0001
  sample_halfwidth_factor: 3.0
  sample_depth: 0.00012
  sample_spacing: 5.0e-07
  inclination_depth: 5.0e-06
  tip_window: 5.0e-06
  initial_tilt_depth_over_a: 0.5
  judge_depth_over_a: 2.0
output:
  dir: data/meanstress_sm31
  save_fields_every: 25
  snapshot_every: 0
