# Al 1350-H19 硬拉铝单丝材料卡。单位一律 SI。
# 每个数值必须有 source（硬约束 2/3）。标 TODO 的项在论文定稿前必须换成
# 可引用的原始文献值，不得留 PLAN.md 作为最终出处。
name: Al 1350-H19

elastic:
  E: 69.0e+9          # Pa
  nu: 0.33
  plane_state: plane_strain   # 生产工况一律平面应变（PLAN 第 1 节）；
                              # plane_stress 只用于复现文献算例，见 DECISIONS.md D-10

strength:
  sigma_u: 185.0e+6   # Pa，抗拉强度（实测值，见 sources；PLAN.md 原写 170）
  sigma_y: 167.0e+6   # Pa，屈服强度，Lévesque 2011（D-50）；2026-10-12 由 165 改 167，
                      # 与下面 plastic.sigma_y0 同值。相场部分不读它（相场用 sigma_c = sigma_u）。

# 断裂参数三角（G_c / ell / sigma_c 只有两个独立，见 DECISIONS.md D-2）。
# mode 指明哪两个是输入：
#   from_sigma_c_and_ell -> 导出 G_c   （当前选择）
#   from_gc_and_ell      -> 导出 sigma_c（D-2 的备选路线）
#   from_gc_and_sigma_c  -> 导出 ell
# 冗余项若同时给出会做一致性校验，不自洽直接报错。
fracture:
  dissipation: AT1   # w(d)=d、c_w=8/3 -> 耗散前因子 3G_c/8（PLAN 第 2 节）。
                     # AT2 仅用于复现 Miehe 2010 / Carrara 2020 的算例（D-10）。
                     # 注意 sigma_c <-> (G_c, ell) 的换算随此项而变，模型必须与之一致。
  mode: from_sigma_c_and_ell
  sigma_c: 185.0e+6   # Pa，取 sigma_c = sigma_u（PLAN.md 第 1 节原文）
  ell: 2.0e-6
  # 2026-09-11 由 4.0e-6 改为 2.0e-6（DECISIONS.md D-28）。
  # 原因是两条约束方向相反、在 ell = 4 µm 下**无解**：
  #   D-27 实测：接触区不静态起裂要求 p0 <= 约 260 MPa；
  #   D-1 规定：a = 2 R p0/E* >= 5 ell，ell = 4 µm 时反过来要求 p0 >= 413 MPa。
  # 取 ell = 2 µm 后可用窗口变成 p0 ∈ [206, 260] MPa，选 p0 = 240 MPa，
  # 得 a = 11.62 µm、a/ell = 5.81、接触区 2a/h = 46.5 个单元，两条都满足。
  # **标定值不受影响**：AT1 关系 3Gc/(8 ell) = sigma_c^2/E 与 ell 无关，
  # 均匀试样的起裂门槛与每周期累积只依赖 sigma_c 与 E（已重跑 calibrate_alpha_t.py 复核）。
  # 连带：G_c 由 5.291 变为 2.645 J/m^2、K_IC,eff 由 0.604 变为 0.427 MPa√m
  # （均为 sigma_c = sigma_u 锚定下的导出量，见 D-2）。        # m，数值正则化长度。接触半宽 a = 2 R p0/E*，
                     # R_wire = 1.875 mm（JL1/LHA1-465/210 的铝单线）时 a ≈ 24.2 um，
                     # 故 a/ell ≈ 6，满足 D-1 要求的 ell <~ a/5。
  # 导出：G_c = 8 sigma_c^2 ell/(3E) ≈ 5.29 J/m^2，
  #       等效 K_IC = sqrt(G_c E/(1-nu^2)) ≈ 0.64 MPa*m^0.5。
  # 注意：这是 *effective phase-field fracture energy*，比铝的真实韧性低约 3 个量级，
  # 后果是一旦萌生扩展极快、寿命几乎全部来自萌生阶段。论文中必须如实说明。

fatigue:
  # 退化函数形式（Carrara et al. 2020, CMAME 361:112731 / arXiv:1811.02244）：
  #   asymptotic  = Eq. (37)，PLAN.md 第 2 节原写的那个。只有 alpha_T 一个参数，
  #                 均匀极限 S-N 斜率被锁死在 1/3，拟合不了铝的 b ≈ 0.13。
  #   logarithmic = Eq. (38)，多一个 kappa 调斜率。**本项目采用**，见 DECISIONS.md D-14。
  form: logarithmic
  # ===== Phase 6.3.1 标定结果（2026-10-13，D-59）：spectral 分解，生产口径 =====
  alpha_T: 1.768679e+05      # J/m^3
  kappa: 0.128608           # 无量纲
  #
  # 来源：scripts/calibrate_alpha_t.py + configs/calib_tension_spectral.yaml，
  #       靶曲线 configs/sn_al1350_reference.yaml 的 4 个标定点。
  # **靶曲线是代理曲线（is_surrogate: true），不是实测数据** —— 论文中必须声明，
  # 拿到实测 S-N 后只需替换该 yaml 并重跑本脚本（D-3）。
  #
  # 标定口径（**与生产工况一致：2D 平面应变 + spectral 分解**，PLAN §2.2）：
  #   - 观测量是**起裂寿命**（d 首次达 1e-3），不是完全断裂（D-14）；
  #   - 每周期累积 Δᾱ = 0.891099 · σ²/(2E) = (1-ν²)σ²/(2E)（解析值 0.891100）；
  #     拉伸峰 ψ⁺_peak = 0.746262 · σ²/(2E)（解析值 ν(1+ν)(1-2ν)+(1-ν)²(1+ν)）；
  #   - 起裂阈值 f = (γs)²，γ = sqrt(0.746262) = 0.863864。
  #
  # 验收：4 点 mean |Δlog10 N| = 0.0612（D-3 阈值 0.30）；有限元与闭式偏差 ≤ 0.008 decade。
  #
  # ===== 旧值（Phase 2.3，D-26，**amor 分解**，保留作对照，勿与上面混用） =====
  #   alpha_T = 1.411481e+06 J/m^3，kappa = 0.140535；
  #   amor 下每周期累积 Δᾱ = 1.556098 · σ²/(2E)（压缩半周期的偏量能仍在 ψ⁺ 中）。
  #   两组参数都拟合同一靶曲线，拉伸标定无法区分分解（D-59）。
  #   一维口径 D-14 的预拟合 (3.407e+6, 0.1489) 与两组平面应变值都不同，不要用。

# 塑性（Phase 5，决策 A：J2 各向同性线性硬化）。H = d sigma_y/d p 是塑性模量。
plastic:
  model: J2_isotropic_linear_hardening
  sigma_y0: 167.0e+6   # Pa，Lévesque 2011 Table（D-50）
  H: 3.0e+9            # Pa。**派生估计，待确认（D-53）**：H = (sigma_u - sigma_y)/eps_p,u，
                       # eps_p,u = eps_u - sigma_u/E - 0.002 ≈ 0.0053（取 eps_u ≈ 1%），得 3.4 GPa；
                       # eps_u = 0.8–1.2% 对应 H ≈ 2.5–5.5 GPa，取中心 3 GPa。
                       # eps_u 没有直接文献值（只有 ORNL 棒材曲线上读出的 0.8–1% 与专利「约 1%」）。

sources:
  E: "PLAN.md 第 1 节（TODO：换 ASM Handbook Vol.2 / IEC 60889 原始值）"
  nu: "PLAN.md 第 1 节（TODO：同上）"
  sigma_u: >-
    185 MPa，取自 1350-H19 单丝疲劳文献一致报道的实测值（E = 69 GPa,
    sigma_y = 165 MPa, sigma_u = 185 MPa），见 configs/sn_al1350_reference.yaml
    的 sources.material_properties（doi:10.1007/s40430-020-02498-w 等）。
    注意与 RTS 计算用的 GB/T 17048 规范最小值 160 MPa 不同：后者是验收下限，
    此处需要的是实测强度。PLAN.md 原写 170 MPa，已按文献改为 185。
  sigma_c: "取 sigma_c ≈ sigma_u，PLAN.md 第 1 节"
  ell: "DECISIONS.md D-1：ell ≈ a/5，a 由 Hertz 的 a = 2 R p0/E* 给出"
  Gc: "由 AT1 关系导出，非独立输入；AT1 关系见 Tanne et al. 2018, JMPS 110:80-99"
  alpha_T: >-
    Phase 6.3.1 按 spectral 分解重标定（D-59）；原 Phase 2.3 的 amor 标定（D-26）为对照。
    靶曲线见 configs/sn_al1350_reference.yaml（代理曲线，非实测，见 DECISIONS.md D-3）。
  sigma_y: >-
    167 MPa，Lévesque et al. 2011（Tribology International，data/_triboint2011.txt 第 101 行附近：
    "1350-H19: E=69 GPa, nu=0.33, Sy=167 MPa"）。注意 sn_al1350_reference.yaml 里的文献报 165 MPa，
    两者差 1.2%，塑性与钳口接触一律取 167（D-50）。
  plastic_H: >-
    **无直接文献值，派生估计（D-53）**。1350-H19 的 eps_u（最大载荷应变）没有可引的测量：
    ORNL Pub12595 §5.2.4 Fig 5-21（棒材，非拉拔丝）曲线峰值约 0.8–1%（读图，非表值）；
    US 9847152 称 1350-H19 股线伸长率「限于约 1%」；ASTM B230 最小伸长率 1.7–1.8%（250 mm 标距，
    是断裂伸长不是均匀伸长）。H 的不确定度约 ±40%，Phase 6/7 须做敏感性分析。
