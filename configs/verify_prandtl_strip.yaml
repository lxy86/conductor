# Phase 6.1 的独立验证：**刚性平冲头**压理想塑性块体，极限平均压力 = (2+π)k = 2.9708 σ_y（Prandtl 1920）。
#
# 口径说明（D-54）：Prandtl 解的前提是「刚性平底冲头 + 半无限体」。这里**不建冲头、
# 不用接触**，而是把冲头的刚性直接作为边界条件：块体顶面 |x| <= w 上给均匀 u_y = -delta、
# 且 u_x = 0（刚性平底、界面不滑），其余顶面自由。这与 Prandtl 的力学问题**同一**，
# 且避开了平-平接触在 dolfinx_contact 里的投影退化（见 D-54 记的失败路线）。
# 接触+塑性的耦合本身另由 6.1 本体的自洽量（力平衡、穿透、γ 敏感性）把关。
#
# 块体必须**足够深**才能看到 Prandtl 平台：塑性区一旦触底，载荷会再次上升。
#
# ⚠️ YAML 1.1：不带指数符号的 1e-7 会被解析成字符串，载入后必须 coerce（fnum）。

geometry:
  half_width: 0.5e-3        # m，冲头半宽 w（受压条带半宽）
  block_half_width: 3.0e-3  # = 6 w
  block_depth: 6.0e-3       # = 12 w。D = 6w 时 p_mean 只到 0.87 × Prandtl（塑性区触底，
                            # 机制无法形成）；D = 12w 才能逼近（D-54 的诊断）

material:
  E: 69.0e+9
  nu: 0.33
  sigma_y: 167.0e+6
  H: 0.0                    # 理想塑性（与闭式解同口径）

loading:
  u_y: -1.2e-4              # 总压下位移（δ/w = 0.24）
  steps: 24
  h_over_w: 0.1             # 条带区单元尺寸 = w/10
  order: 1                  # 几何阶
  degree: 1                 # 位移元阶。P1 够用：nu = 0.33 远离不可压，不像 5.4 的 nu = 0.5
                            # 那样需要 P2 抗体积锁死；P1 让 96k dof 的大网格便宜 4 倍

solver:
  # SI 单位下残差的舍入底 ~1e-9 N/m（力尺度 sigma_y * w = 8.4e4 N/m），绝对容差须高于它
  newton_atol: 1.0e-5
  newton_rtol: 1.0e-3
  max_it: 40
  ksp_tol: 1.0e-11

tolerance:
  # 口径（D-54）：Prandtl 是**半无限体**的极限载荷；有限块 + 固定底面只能从下方渐近逼近。
  # 实测比值随 δ/w 单调升：0.030→0.791、0.120→0.947、0.240→0.976。故判据取
  # 「够近 + 单调逼近 + 网格无关」，不是等式。阈值在此轮**诊断之后**定，如实记录。
  min_ratio: 0.96            # 细网格末值 / 2.9708 的下限
  monotone_steps: 8          # 检查末 8 步的单调性
  monotone_slack: 0.002      # 单调性允许的回退
  refine_slack: 0.03         # 两档网格末值之比的最大差（下界严格为 0：细化必须抬高比值）。
                             # 实测 0.0255（0.9501 -> 0.9756），故取 0.03
  contained: 0.9             # 实质塑性区（p > 0.01 σ_y/E）深度 < 90% 块深
  refine: [0.15, 0.1]        # 两档 h/w：粗 6400 单元、细 14400 单元

output:
  dir: data/verify_prandtl_strip
