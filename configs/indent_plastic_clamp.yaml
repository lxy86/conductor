# Phase 6.1 本体：弹塑性线夹压单丝（PLAN §6.1）。无摩擦、无相场。
#
# 几何（PLAN §1.1，2D 平面应变，导线轴向–径向平面）：单丝截面 = 矩形（厚 = 直径 D），
# 线夹 = 刚体，其轴向曲率半径 R_clamp = 330 mm（Lévesque 2011 实测，D-50）。
# 因此接触是「半径 330 mm 的圆弧 压 平板」—— 弧-平接触，与 4.3 Hertz 同型。
#
# 目标：确认接触压力**饱和**（D-50：完全塑性时平均压力 2.15 σ_y = 359 MPa，
# 平面应变 Prandtl 上限 2.97 σ_y = 496 MPa），并实测**塑性接触半宽 a_pl**
# （PLAN 6.2 的加密区尺寸必须按它定，不得沿用旧模型的 11.62 µm）。
#
# ⚠️ YAML 1.1：不带指数符号的 1e-7 会被解析成字符串，载入后必须 coerce（fnum）。

geometry:
  R_clamp: 330.0e-3         # m
  D: 3.75e-3                # 单丝直径（= 平面应变里的厚度）
  Lw: 40.0e-3               # 单丝长度。D-56：Lw 从 12 增到 40 mm 后塑性区仍贴域边界，Lw 不是主因；
                            # 主因是接触核线弹性、体本构塑性不一致（见 D-56 第 3 条）
  Lc: 12.0e-3               # 线夹宽度
  Hc: 3.0e-3                # 线夹高度
  gap: 0.0                  # 初始相切

material:
  E_wire: 69.0e+9
  nu_wire: 0.33
  sigma_y: 167.0e+6         # D-50
  H: 3.0e+9                 # 派生估计，D-53（待确认）；Phase 7 做敏感性
  E_clamp: 1.38e+12         # = 20 E_wire（准刚性；100x 会让接触迭代进极限环，D-54）
  nu_clamp: 0.3

loading:
  u_y: -1.5e-5              # 总压下位移。**只推到工作点附近**：再往下推会进入「受限薄层挤压」，
                            # 位移驱动下压力无上限地涨（δ = 120 µm 时 p 达 25 σ_y、几乎均匀铺满顶面），
                            # 那不是线夹的工况 —— 真实约束是**夹持力** W'，不是位移（D-55）。
  steps: 15
  w_target: 1.75e+6         # N/m，D-50 的操作夹持力 W'（用于取"工作点"报告）

mesh:
  h_fine: 50.0e-6           # 接触区单元尺寸。150 µm 时弹性段接触区只有 ~10 个采样点，
                            # Hertz 对拍 a 差 3.25%、p0 差 5.99%（采样误差，见 D-55）；
                            # 50 µm 给到 ~30 点
  h_coarse: 750.0e-6
  fine_halfwidth: 5.0e-3    # 加密半宽
  order: 1                  # 几何阶
  degree: 1                 # 位移元阶（nu = 0.33 远离不可压，P1 足够；P2 会慢 4 倍）

solver:
  # SI 单位下残差舍入底随刚度比升高（D-54）：绝对容差是约束项
  newton_atol: 1.0e-5
  newton_rtol: 1.0e-3
  max_it: 40
  ksp_tol: 1.0e-10
  nitsche_gamma_factor: 1000.0   # 100 -> 1000 实测 p0 变 8%（未完全收敛），10000 不收敛；
                                 # 6.1 的结果带着这个不确定性报告（D-55）
  nitsche_theta: 1.0

tolerance:
  force_balance: 0.01        # 顶面合力 vs 接触面压力积分
  penetration_over_a: 0.01
  gamma_sensitivity: 0.03    # γ 加倍后 p0、a 的变化
  p0_band_over_sy: [1.6, 3.4]  # 工作点 p0/σ_y 的允许带（D-50 的 2.15 与 Prandtl 2.97）+ 余量
  elastic_rel: 0.03          # 弹性段 a、p0 vs Hertz（4.3 的阈值）

output:
  dir: data/indent_plastic_clamp
