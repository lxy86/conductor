# Phase 2.4 基准微动疲劳工况。**这是整个项目的硬关卡**：
# 必须复现「裂纹在接触边缘 x ≈ ±a 附近（滑移区）萌生，初始倾斜，
# 随后转向垂直于本体应力方向」。若不满足，停下报告，**不得调参凑结果**（硬约束 6）。
#
# 参数来源：PLAN.md Phase 2.4，几何/尺度按 DECISIONS.md D-1 修订
# （R_wire 1.6 -> 1.875 mm、ell = 4 µm、失效改绝对深度 100 µm）。
case_type: fretting
material: configs/material_al1350.yaml

model:
  # **D-8 应急步骤 ①：改用 spectral 分解**。启用条件（「确证 d 长在接触中心
  # 而非边缘」）已由 data/_fretting_elastic_probe.py 确证：
  #   amor:     接触中心的弹性 ψ⁺ 就有 1.5~1.7 倍起裂门槛，9.60% 单元越门槛，
  #             冒烟算例里 d 果然长在 x = −0.03a（接触中心）；
  #   spectral: 中心 ψ⁺/门槛 = 0.00，仅接触边缘 ±1.03a 处 19 个单元（0.10%）越门槛，
  #             冒烟算例里裂纹萌生于 x = −1.02a（滑移区），位置正确。
  # 原因：Amor 把静水压缩归 ψ⁻ 但**偏量项仍留在 ψ⁺**，而接触中心正是高静水压、
  # 高偏量的区域，于是产生「压应力假损伤」。spectral 按主应变分解，压缩主应变
  # 不进 ψ⁺，中心自然干净。
  # 按 D-8，启用 ① 不影响「自发复现表面萌生」的声称（那是步骤 ③ 才禁止的）。
  split: spectral
  dissipation: AT1      # 硬约束 1
  k_res: 1.0e-6

solver:
  u_solver: newton      # spectral 没有冻结形式，必须走精确非线性路径
  tol_d: 1.0e-4
  max_iter: 2000        # D-35：300 不够。sigma_a=45 在 N=12435 处需要 402 次
                        # 交错迭代才收敛，卡在 300 上限、重试三次都栽在同一点。
                        # 失稳判别器把它判成 converged（「不是失稳，是爬得慢」），
                        # 正是这条判别把「解不动」和「没有解」分开了 ——
                        # 否则会被误当成失稳，寿命少算一大截。
                        # 放大不会掩盖真失稳：真失稳在任何迭代数下都不收敛
                        # （D-32 实测 omega=0.05 推 2000 次仍残差 1.86e-1）。
  u_linesearch: basic   # D-31：第二次跑（带欠松弛）在 N=32343、深 2.5 µm 处
                        # 报 u 的 SNESConvergedReason=-6（线搜索失败）。
                        # spectral 分解的 psi+ 只在主应变过零处 C^0，u 的残差
                        # 分片光滑，而回溯线搜索假设 merit 函数光滑，会在折点
                        # 处找不到下降方向。basic 直接取整步。改的是求解算法，
                        # 不动方程与参数。
  relaxation: 0.25      # D-32：0.5 在 N=80012（深 13.5 µm ≈ 1.16a）处交错振荡，
                        # 残差卡在 1.428e-3 不降。冻结 ᾱ 的静态探针证明该状态本身
                        # 是稳定的：omega=0.25 两步收敛、后续残差逐位为 0、深度不动，
                        # 所以墙是数值的，不是物理失稳。
                        # 原注（D-30）：第一次跑漏了这一行（其余生产配置全都有），
                        # 结果在 N=79975、深 13.5 µm 处交错迭代进极限环：
                        # 300 次停在 ‖Δd‖_inf=2.65e-3，ΔN 减半到 1 仍是**同一个值**
                        # —— 是振荡不是步长。欠松弛不改变不动点，只改迭代路径。

contact:
  # 接触半宽 a 由 loads 从 (p0, R, E*) 算出，**不在这里写死** —— 见 D-25：
  # 网格用的 a 与面力用的 a 必须同源，各算各的迟早会漂，而 a 一旦不一致，
  # 「裂纹在 x ≈ ±a 萌生」这条判据就失去意义。
  p0: 240.0e+6          # Pa。由 PLAN 的 500 MPa 降下来，见 D-27/D-28：
                        # 500 MPa 下弹性解本身就越过起裂门槛（3.66 倍），
                        # 损伤是静态的、且萌生寿命随网格细化差 450 倍。
                        # 240 MPa 在窗口 [206, 260] 内，留约 8% 余量。
  mu: 0.7               # 摩擦系数
  Q_over_muP: 0.6       # Q/(μP)，部分滑移；c/a = sqrt(1-0.6) = 0.632
  R_wire: 1.875e-3      # m，JL1/LHA1-465/210 的铝单线半径（D-6）
  counterpart: aluminum # 铝-铝对偶 -> R = R_wire/2、E* 用两个铝

mesh:
  type: fretting
  W: 6.4e-3             # = 2H，与 R_wire 挂钩（D-1）；W/a ≈ 265，满足 St. Venant
  H: 3.2e-3
  refine_halfwidth_factor: 3.0     # 加密区 |x| <= 3a（D-1）
  refine_depth: 130.0e-6           # 失效判据是 100 µm，留 1.3 倍余量
                                   # （a 变小后加密区变窄，这里略收深度以控单元数）
  h_fine: 0.5e-6                   # = ell/4（ell 已改为 2 µm）；接触区 2a/h ≈ 46.5 个单元
  h_coarse: 2.0e-4
  transition_factor: 8.0

loading:
  # 比例加载简化（PLAN 第 2 节，论文中说明）：法向压力恒定，
  # 切向面力与本体应力同相位正弦往复。
  #   q(x,t) = q(x) sin(2 pi t/T),  sigma_b(t) = sigma_a sin(2 pi t/T)
  type: fretting_contact
  sigma_a: 35.0e+6      # Pa，本体应力幅（零峰值幅值）
  cycle:
    n_sub: 8            # PLAN 第 2 节
    dN_init: 100.0
    dN_min: 1.0
    dN_max: 1.0e+5
    dd_max: 0.02
    grow_below: 0.5
    factor: 2.0
    N_max: 1.0e+8       # PLAN：超过即 runout
    peak_phase: null    # 自动取 ∫psi+ dx 最大的子步
  dump_every: 25

failure:
  # D-1：判据改为**绝对深度 100 µm**（≈4a），不是 0.5*R_wire = 937 µm。
  # 理由：微动寿命由萌生与短裂纹主导；0.5R 需要约 40a 的扩展距离，
  # 在 h = 1 µm 下不可行。N_f 的定义（萌生 + 短裂纹到 100 µm）必须写进论文。
  d_threshold: 0.95
  depth: 100.0e-6
  # 裂纹采样网格（failure.DamageGrid：表面在 y=0、深度向下为正）
  sample_halfwidth_factor: 3.0     # |x| <= 3a，与加密区同宽
  sample_depth: 120.0e-6           # 略小于 refine_depth，保证采样点都在加密区内
  sample_spacing: 0.5e-6           # = h_fine；再细无意义（d 是 P1）
  inclination_depth: 5.0e-6        # 量「初始倾角」（判据 2）的**表层**窗口 = 2.5 ell；
                                   # 对应 10 个采样行，足够拟合角度
  tip_window: 5.0e-6               # 量「尖端当前扩展方向」（判据 3）的窗口，贴着最深处。
                                   # 必须和上一条分开：表层窗口固定在 min(5 µm, depth)，
                                   # 裂纹深过它之后就永远在量最初那一段，按定义
                                   # 反映不了转向（OPEN-2）。
  judge_depth_over_a: 2.0          # 长到 2a = 23.2 µm 才判「是否转向」；没长到就记
                                   # inconclusive 而不是 fail。stage I 斜向段本就
                                   # 延伸到接触半宽量级，之后才转 mode I。

output:
  dir: data/fretting_base
  save_fields_every: 25   # D-31：断点（此前 fretting 路径根本没实现存场，改这个值无效）。
                          # 前三次跑崩都无断点可续，合计白丢约 17 小时。
                          # 25 个 jump 步：临近墙时约 44 s/步，即约 18 min 一个断点。
